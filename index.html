rg 針對 $IQE 出了新報告:\n「磷化銦基板正成為半導體產業的關鍵風險。」\n去年就靠 $AXTI 猜到這件事的人是誰呢?", "quoted_zh": "你看…路透社新報告指出，中國掌控磷化銦（InP）會威脅AI資料中心的建設。\n誰能猜到 $AXTI 會是主要的失效點呢?…", "theme_zh": "磷化銦基板"}, {"id": "2096890295128625153", "link": "https://x.com/aleabitoreddit/status/2096890295128625153", "author": "aleabitoreddit", "time": "2026-09-07T09:16:19.000Z", "text": "I'll let you decide that for yourself since that was an illustrative laser revenue modeling off $SIVE 100M CW DFB laser/year target. \n\nBut... do you want to know the main reason I like laser companies so much?\n\nThey don't just have to stay laser companies... just look at \n$LITE\n!", "social": "", "quoted": "What do you think is a fair revenue multiple you would assign to $SIVE if their recent expansion is able to deliver on $625M-$1.25B of annualized revenue?", "tickers": [{"t": "SIVE", "stance": "bullish", "reason": "modeled 100M CW DFB laser/year revenue target", "reason_zh": "模型設定年產1億顆雷射目標"}, {"t": "LITE", "stance": "bullish", "reason": "cited as example of laser company expanding beyond lasers", "reason_zh": "舉例說明雷射公司能跨業擴張"}], "theme": "CW lasers", "paywalled": false, "zh": "這個留給你自己判斷，因為那只是根據 $SIVE 每年一億顆 CW DFB 雷射目標做的示範性營收模型。\n不過...你想知道我為什麼這麼愛雷射公司嗎?\n因為他們不一定要一直當雷射公司...看看 $LITE 就知道!", "quoted_zh": "如果 $SIVE 最近的擴產真的能達到 $625M 到 $1.25B 的年化營收，你覺得該給他們多少倍的合理營收本益比?", "theme_zh": "連續波雷射"}, {"id": "2096858276290015563", "link": "https://x.com/aleabitoreddit/status/2096858276290015563", "author": "aleabitoreddit", "time": "2026-09-07T07:09:05.000Z", "text": "Is there any other industry... Where every investor is cheering for shortages and price hikes? \n\nSED reported today that: Samsung / \n$SKHY\n \"stockpiles have fallen to less than 10 days of supply, and a severe shortage could emerge next year, according to a new forecast\"\n\nKB", "social": "", "quoted": "", "tickers": [{"t": "Samsung", "stance": "bullish", "reason": "stockpiles under 10 days supply, severe shortage forecast next year", "reason_zh": "庫存不到10天，明年恐嚴重短缺"}, {"t": "SKHY rtfolio of: SLC/SPI NAND, NOR Flash, DDR2/DDR3, MCP/eMCP, so all the fun legacy stuff.\n\nIf you want to look at broader industry price hikes coming up that ESMT has exposure to:  \n\n1. SLC NAND: ~120-170% x.com/Joylou1209/sta…", "tickers": [{"t": "ESMT (3006)", "stance": "bullish", "reason": "legacy memory exposure amid industry price hikes", "reason_zh": "傳統記憶體布局，產業將漲價"}], "theme": "legacy memory", "paywalled": false, "zh": "沒想到我的 ESMT 論點在台灣媒體像 Cnyes/鉅亨網上被討論。\n覺得蠻好笑的，我只是想看看最近有什麼評論，結果一直看到自己的名字。\n特別感謝 BlockBeats 的原始報導。", "quoted_zh": "對，ESMT（3006）在好幾個傳統記憶體領域都有布局。\n產品線包含: SLC/SPI NAND、NOR Flash、DDR2/DDR3、MCP/eMCP，都是傳統老產品。\n如果想看 ESMT 有布局、產業接下來會漲價的項目:\n1. SLC NAND: 漲幅約120-170%…", "theme_zh": "傳統記憶體"}, {"id": "2096605093986787380", "link": "https://x.com/aleabitoreddit/status/2096605093986787380", "author": "aleabitoreddit", "time": "2026-09-06T14:23:02.000Z", "text": "I asked OpenAI Astra Ultra + Anthropic Fable 5.1 Max to make me a 5x-10x return type portfolio in 1 year. \n\nBurnt a lot of credits, and the results are in: \n\nOpenAI: - \n$KYTX\n (autoimmune CAR-T results)\n- \n$PRQR\n (human RNA-editing datasets)\n- \n$VSTM\n (KRAS cancer-drug)\n- \n$CNTB\n (asthma", "social": "", "quoted": "OpenAI's Astra is now available.", "tickers": [{"t": "KYTX", "stance": "neutral", "reason": "AI-generated pick for autoimmune CAR-T results, no personal view given", "reason_zh": "AI選股,CAR-T結果,無評論"}, {"t": "PRQR", "stance": "neutral", "reason": "AI-generated pick for human RNA-editing datasets, no personal view given", "reason_zh": "AI選股,RNA編輯數據,無評論"}, {"t": "VSTM", "stance": "neutral", "reason": "AI-generated pick for KRAS cancer drug, no personal view given", "reason_zh": "AI選股,KRAS癌症藥,無評論"}, {"t": "CNTB", "stance": "neutral", "reason": "AI-generated pick for asthma, no personal view given", "reason_zh": "AI選股,氣喘相關,無評論"}], "theme": "AI stock picks", "paywalled": false, "zh": "我請 OpenAI Astra Ultra 加 Anthropic Fable 5.1 Max,幫我做一個一年報酬 5 倍到 10 倍的投資組合。燒了很多額度,結果出來了。OpenAI:$KYTX(自體免疫 CAR-T 結果)、$PRQR(人類 RNA 編輯數據)、$VSTM(KRAS 癌症藥物)、$CNTB(氣喘", "quoted_zh": "OpenAI 的 Astra 現在上線了。", "theme_zh": "AI選股"}, {"id": "2096455073580908908", "link": "https://x.com/aleabitoreddit/status/2096455073580908908", "author": "aleabitoreddit", "time": "2026-09-06T04:26:54.000Z", "text": "I’m not sure how OpenAI was likely holding off their IPO to 2027.\n\nBecause they had concerns about a $1T valuation 3 months ago.\n\nThen Anthropic investors go and say **** it, lets one-up \n$SPCX\n and IPO at $2T next month?", "social": "", "quoted": "", "tickers": [], "theme": "IPO valuation", "paywalled": false, "zh": "我不太懂 OpenAI 為什麼可能把 IPO 延到 2027 年。因為三個月前他們還在擔心 1 兆美元估值太高。結果 Anthropic 的投資人直接說算了,不管了,要贏過 $SPCX,下個月就用 2 兆美元估值 IPO?", "quoted_zh": "", "theme_zh": "IPO估值"}, {"id": "2096149203278037407", "link": "https://x.com/aleabitoreddit/status/2096149203278037407", "author": "aleabitoreddit", "time": "2026-09-05T08:11:29.000Z", "text": "Now that \n$MU\n to \n$SNDK\n have pulled a major recovery. \n\nGood to have a reminder that the memory bottleneck hasn’t changed!\n\nSame with CW lasers… substrates… or others.\n\nBut short term sentiment (depending on prices/macro) often does.\n\nI think a lot of demand imbalances get worse", "social": "", "quoted": "Yes, I'm still bullish on memory like $MU / Samsung.\n\nAs I said earlier, markets tend to rotate from bottleneck to bottleneck.\n\nThis week it looks $AXTI to $LITE in the photonics sector is the focus again. \n\nThe thing is... the primary thing that changed are the stock prices,  x.com/KostasMoschova…", "tickers": [{"t": "MU", "stance": "bullish", "reason": "Memory bottleneck unchanged, demand imbalances getting worse despite price recovery", "reason_zh": "記憶體瓶頸沒變,供需失衡惡化中"}, {"t": "SNDK", "stance": "bullish", "reason": "Memory bottleneck unchanged, demand imbalances getting worse despite price recovery", "reason_zh": "記憶體瓶頸沒變,供需失衡惡化中"}], "theme": "legacy memory", "paywalled": false, "zh": "$MU 到 $SNDK 都已經出現明顯反彈。剛好提醒大家,記憶體的瓶頸沒有變。CW 雷射、基板等等也一樣。但短期市場情緒(看價格和總經)常常會變。我覺得很多供需失衡會惡化", "quoted_zh": "對,我對記憶體像 $MU、三星還是看多。我之前說過,市場常常從一個瓶頸轉到下一個瓶頸。這禮拜看起來光子產業的 $AXTI 到 $LITE 又變成焦點。重點是,真正改變的只有股價,x.com/KostasMoschova…", "theme_zh": "舊世代記憶體"}, {"id": "2096122640465645937", "link": "https://x.com/aleabitoreddit/status/2096122640465645937", "author": "aleabitoreddit", "time": "2026-09-05T06:25:56.000Z", "text": "I think this approach is great: drawing from my research on older-generation memory chips like ESMT DDR2/DDR3, and applying it by analogy.\n\nOr taking the perspective I developed during my $AAOI research on the supply-demand imbalance for CW lasers, and applying it to A-shares.", "social": "", "quoted": "@grok Does China have any listed companies that produce DDR2/DDR3 comparable to ESMT?", "tickers": [{"t": "ESMT (3006)", "stance": "bullish", "reason": "DDR2/DDR3 research approach reused as analogy, thesis still holds", "reason_zh": "DDR2/DDR3研究拿來類比,論點還成立"}, {"t": "AAOI", "stance": "bullish", "reason": "CW laser supply-demand imbalance thesis reused as analogy for A-shares", "reason_zh": "CW雷射供需失衡論點,套用到A股"}], "theme": "supply-demand imbalance", "paywalled": false, "zh": "我覺得這個方法很棒:用我研究舊世代記憶體晶片(像 ESMT 的 DDR2/DDR3)的心得,類比套用過去。或是用我研究 $AAOI 時,對 CW 雷射供需失衡的觀點,套用到 A 股上。", "quoted_zh": "@grok 中國有沒有上市公司生產 DDR2/DDR3,規模跟 ESMT 差不多的?", "theme_zh": "供需失衡"}, {"id": "2095974877115380043", "link": "https://x.com/aleabitoreddit/status/2095974877115380043", "author": "aleabitoreddit", "time": "2026-09-04T20:38:46.000Z", "text": "There's actually a whole new universe I haven't di…", "social": "", "quoted": "", "tickers": [], "theme": "", "paywalled": true, "zh": "其實還有一整個全新的領域我還沒…", "quoted_zh": "", "theme_zh": ""}, {"id": "2095957075302273257", "link": "https://x.com/aleabitoreddit/status/2095957075302273257", "author": "aleabitoreddit", "time": "2026-09-04T19:28:02.000Z", "text": "OpenAI's Astra is now available.", "social": "", "quoted": "", "tickers": [], "theme": "", "paywalled": false, "zh": "OpenAI 的 Astra 現在上線了。", "quoted_zh": "", "theme_zh": ""}, {"id": "2095882424932766163", "link": "https://x.com/aleabitoreddit/status/2095882424932766163", "author": "aleabitoreddit", "time": "2026-09-04T14:31:24.000Z", "text": "Let me get this straight chat… you have:\n\n\n$NVDA\n 70% supply constrained revenue growth projections (would be 100%+)\n\n\n$AVGO\n AI revenue growing 100%+ Y/Y for next 2 years from mid ~$50B -\u003e $230B\n\nOpenAI Astra blowing away AGI benchmarks and starting to train itself.\n\n\n$MSFT\n / \n$GOOGL", "social": "", "quoted": "", "tickers": [{"t": "NVDA", "stance": "bullish", "reason": "70% supply-constrained growth, would be 100%+ without constraints", "reason_zh": "供應受限成長70%,解限後上看100%+"}, {"t": "AVGO", "stance": "bullish", "reason": "AI revenue to double for two years, mid-$50B to $230B", "reason_zh": "AI營收兩年翻倍,500億到2300億"}, {"t": "MSFT", "stance": "bullish", "reason": "Grouped as AI beneficiary in sarcastic overwhelming bull case list", "reason_zh": "被列入AI受惠股,語氣諷刺看多過頭"}, {"t": "GOOGL", "stance": "bullish", "reason": "Grouped as AI beneficiary in sarcastic overwhelming bull case list", "reason_zh": "被列入AI受惠股,語氣諷刺看多過頭"}], "theme": "AI capex", "paywalled": false, "zh": "讓我搞清楚喔,各位。你們現在有:$NVDA 因為供應受限,營收成長預測只有 70%(拿掉限制的話會超過 100%)。$AVGO 的 AI 營收未來兩年年增率超過 100%,從約 500 億美元成長到 2300 億美元。OpenAI 的 Astra 把 AGI 基準測試全部打爆,還開始自我訓練。$MSFT、$GOOGL", "quoted_zh": "", "theme_zh": "AI資本支出"}, {"id": "2095851749127188691", "link": "https://x.com/aleabitoreddit/status/2095851749127188691", "author": "aleabitoreddit", "time": "2026-09-04T12:29:30.000Z", "text": "From my channel checks, it appears Korean retail is firmly siding with \n$HOOD\n over the \n$AMC\n CEO.\n\nKorean sources find the prospect of 40x leveraged Samsung / \n$SKHY\n a powerful enough argument to win the tokenization debate.", "social": "", "quoted": "", "tickers": [{"t": "HOOD", "stance": "neutral", "reason": "Korean retail reportedly siding with HOOD over AMC CEO in debate", "reason_zh": "傳韓國散戶挺HOOD,不挺AMC執行長"}, {"t": "Sa ly", "reason_zh": "日本EUV材料近乎壟斷"}, {"t": "ShinEtsu", "stance": "neutral", "reason": "Named as Japanese EUV material near-monopoly", "reason_zh": "日本EUV材料近乎壟斷"}, {"t": "Fujifilm", "stance": "neutral", "reason": "Named as Japanese EUV material near-monopoly", "reason_zh": "日本EUV材料近乎壟斷"}], "theme": "EUV supply chain", "paywalled": false, "zh": "先講一下我對美中緊張情勢的看法。歐洲有幾家壟斷型公司,像是:$ASML(EUV)、$SOI(光子 SOI)、Zeiss SMT(ASML 的 EUV 供應商)、Trumpf(ASML 的 EUV 雷射供應商)。日本也有很多接近或完全壟斷的公司,像是:TOK、JSR、ShinEtsu、Fujifilm,都是做 EUV 的", "quoted_zh": "傳中國暫停部分稀土出貨到美國。不是新的全面禁令,也沒提到是哪些稀土。不過,如果要我猜,日本通常是個不錯的指標,因為日本幾乎所有的鏑和鋱都靠", "theme_zh": "EUV供應鏈"}, {"id": "2095802636876619928", "link": "https://x.com/aleabitoreddit/status/2095802636876619928", "author": "aleabitoreddit", "time": "2026-09-04T09:14:21.000Z", "text": "China reportedly halts some rare earth shipments to US.\n\nNot a new blanket ban, or any mention of specific rare earths. \n\nBut… if I had to guess, Japan is usually a decent indicator of what’s actively important since Japan:\n\n- “sources virtually all of its dysprosium and terbium", "social": "", "quoted": "", "tickers": [], "theme": "rare earths", "paywalled": false, "zh": "傳中國暫停部分稀土出貨到美國。不是新的全面禁令,也沒提到是哪些稀土。不過,如果要我猜,日本通常是個不錯的指標,因為日本幾乎所有的鏑和鋱都靠", "quoted_zh": "", "theme_zh": "稀土"}, {"id": "2095590610967421206", "link": "https://x.com/aleabitoreddit/status/2095590610967421206", "author": "aleabitoreddit", "time": "2026-09-03T19:11:50.000Z", "text": "OpenAI GPT-6 Astra benchmarks got released. Looks both AGI and the Singularity are almost here.\n\nThe leap in eval performance:\n\nFrom 78.5% -\u003e 100% on ExploitBench to 22.4% -\u003e 64.6% on the Science benchmark is enormous. \n\nAnd the most striking part is the VP of Research comment", "social": "", "quoted": "Could you post your thoughts on the new Astra 6 benchmarks from open AI ? Seems like we are getting closer and closer to AGI", "tickers": [], "theme": "AI benchmarks", "paywalled": false, "zh": "OpenAI GPT-6 Astra 的基準測試結果公布了。看起來 AGI 跟 hing from \n$AXTI\n to \n$IREN\n get nuked… I’m starting to believe in the:\n\n“September is the worst month of the year” myth.", "social": "", "quoted": "", "tickers": [{"t": "AXTI", "stance": "neutral", "reason": "Noted as getting nuked amid September seasonality talk", "reason_zh": "在9月季節性話題下被提及股價重挫"}, {"t": "IREN", "stance": "neutral", "reason": "Noted as getting nuked amid September seasonality talk", "reason_zh": "在9月季節性話題下被提及股價重挫"}], "theme": "seasonality", "paywalled": false, "zh": "看到AXTI到IREN全部被血洗之後…我開始有點相信「9月是全年最差的月份」這個說法了。", "quoted_zh": "", "theme_zh": "季節性"}, {"id": "2094786201605808566", "link": "https://x.com/aleabitoreddit/status/2094786201605808566", "author": "aleabitoreddit", "time": "2026-09-01T13:55:24.000Z", "text": "What... \n$GPRO\n is up 79.17% after planning to merge with a photonics company \"Starman Optical\"\n\nTo build US 800G/1.6T optical transceivers for AI data centers.\n\nGoPro trying to compete with \n$AAOI\n was definitely not on my radar.", "social": "", "quoted": "", "tickers": [{"t": "GPRO", "stance": "neutral", "reason": "Surprised by 79% jump on photonics merger news, wasn't expected", "reason_zh": "因光子合併消息大漲79%,完全出乎意料"}], "theme": "optical transceivers", "paywalled": false, "zh": "什麼…GPRO因為計劃跟光子科技公司「Starman Optical」合併,股價大漲79.17%。要為AI資料中心做美國製的800G/1.6T光學收發器。GoPro跑去跟AAOI競爭,完全沒在我預料之內。", "quoted_zh": "", "theme_zh": "光學收發器"}, {"id": "2094704372831920324", "link": "https://x.com/aleabitoreddit/status/2094704372831920324", "author": "aleabitoreddit", "time": "2026-09-01T08:30:14.000Z", "text": "Just some TLDR news I found interesting:\n\n1. \n$GOOGL\n (missed this) also invested in Mediatek alongside \n$NVDA\n for their $3.9B raise. \n\nGoogle/Nvidia are goats with investments you look at \n$SPCX\n to Anthropic. \n\n2. Samsung Electro-Mechanics discloses $778.9M MLCC deal / \n$CAPA\n (new", "social": "", "quoted": "", "tickers": [{"t": "GOOGL", "stance": "bullish", "reason": "Called a \"goat\" for smart co-investment in Mediatek" book feels similar to what they did with Neoclouds like \n$NBIS", "social": "", "quoted": "$NVDA is the winner here - they cover even custom chips via $MRVL and MediaTek", "tickers": [{"t": "NVDA", "stance": "bullish", "reason": "Playing kingmaker across the next-gen ASIC ecosystem", "reason_zh": "在整個ASIC生態系裡扮演造王者"}, {"t": "MRVL", "stance": "bullish", "reason": "Named a next-gen ASIC winner backed by Nvidia", "reason_zh": "被點名為Nvidia扶持的下一代ASIC贏家"}, {"t": "MediaTek", "stance": "bullish", "reason": "Named a next-gen ASIC winner backed by Nvidia", "reason_zh": "被點名為Nvidia扶持的下一代ASIC贏家"}, {"t": "AVGO", "stance": "bearish", "reason": "Sees its position eroded as second-order effect of Nvidia's moves", "reason_zh": "因Nvidia的動作間接被侵蝕地位"}], "theme": "ASIC ecosystem", "paywalled": false, "zh": "對,NVDA投資聯發科3.5B美元。感覺Nvidia在下一代ASIC贏家裡扮演造王者的角色,像MRVL和聯發科。連帶效應是侵蝕AVGO的地位。這套打法跟他們對Neocloud業者(像NBIS)做的事很像。", "quoted_zh": "NVDA才是真正的贏家,連客製化晶片都靠MRVL和聯發科通吃", "theme_zh": "ASIC生態系"}, {"id": "2094405648293482965", "link": "https://x.com/aleabitoreddit/status/2094405648293482965", "author": "aleabitoreddit", "time": "2026-08-31T12:43:13.000Z", "text": "Today, \n$NVDA\n has announced a $3.5B investment into Mediatek. \n\nIt appears Nvidia is \"networking\" itself into the broader ASIC ecosystem, from \n$MRVL\n to MediaTek.\n\nAnd have future ecosystems aligned with Nvidia standards. (maybe to fend off \n$AVGO\n as well)", "social": "", "quoted": "", "tickers": [{"t": "NVDA", "stance": "bullish", "reason": "Networking itself into broader ASIC ecosystem, aligning standards", "reason_zh": "把自己連結進ASIC生態系,主導標準對齊"}, {"t": "MRVL", "stance": "bullish", "reason": "Part of ecosystem Nvidia is aligning to its own standards", "reason_zh": "是Nvidia想對齊自身標準的生態系一員"}, {"t": "MediaTek", "stance": "bullish", "reason": "Part of ecosystem Nvidia is aligning to its own standards", "reason_zh": "是Nvidia想對齊自身標準的生態系一員"}, {"t": "AVGO", "stance": "bearish", "reason": "Investment seen as move to fend off Broadcom", "reason_ .000Z", "text": "I'm going to miss the days of Korean retail reacting heavily to \n$EWY\n / Samsung / \n$SKHY\n daily volatility.\n\nNew piece: \"Korean day traders flee leveraged chip ETFs as regulatory curbs bite\"\n\n- Trading value in ETFs designed to deliver 2x daily returns of Samsung / SK Hynix has", "social": "", "quoted": "", "tickers": [{"t": "Samsung", "stance": "neutral", "reason": "Subject of leveraged ETF retail trading, regulatory curbs reducing volume", "reason_zh": "槓桿ETF散戶標的,監管趨緊"}, {"t": "SKHY", "stance": "neutral", "reason": "Subject of leveraged ETF retail trading, regulatory curbs reducing volume", "reason_zh": "槓桿ETF散戶標的,監管趨緊"}], "theme": "Korean retail trading", "paywalled": false, "zh": "以後應該會很懷念韓國散戶對$EWY/三星/$SKHY每天大幅波動有強烈反應的日子。新文章:「監管收緊,韓國當沖客逃離槓桿晶片ETF」。設計成三星/SK海力士2倍日報酬的ETF,交易量已經", "quoted_zh": "", "theme_zh": "韓國散戶"}, {"id": "2094083798204047577", "link": "https://x.com/aleabitoreddit/status/2094083798204047577", "author": "aleabitoreddit", "time": "2026-08-30T15:24:18.000Z", "text": "The more I look at ESMT, the more excited I get researching legacy memory themes. \n\nSo looked through H1 sellside models...\n\nFrom March ESMT reports:\nHuanan: DDR3 4Gb ASP +50% QoQ in Q2\nFubon: cited roughly +40% Q2 DRAM pricing\n\nBy August... Huanan was citing ESMT Q2 ASP growth", "social": "", "quoted": "Memory Industry (20260810)\n- DRAM Structure: Mainstream types account for about 80% (high-capacity DDR4/DDR5, Data Center, PC); Niche types about 20% (DDR3, low-capacity DDR4, Industrial Control, Medical). Supply is highly concentrated: Samsung, Micron, SK Hynix about 95%; CXMT x.com/aleabitoreddit…", "tickers": [{"t": "ESMT (3006)", "stance": "bullish", "reason": "Excited by legacy memory theme; DDR3 ASP growth accelerating per sellside data", "reason_zh": "對傳統記憶體題材感興奮"}], "theme": "legacy memory", "paywalled": false, "zh": "我越研究ESMT,對傳統記憶體主題越感興趣。看了上半年賣方模型。3月ESMT報告:華南證券說DDR3 4Gb ASP第二季QoQ成長50%。富邦說第二季DRAM價格大約漲40%。到了8月,華南證券提到ESMT第二季ASP成長", "quoted_zh": rong multiple if it’s telling the story to the wrong audience.", "tickers": [{"t": "SIVE", "stance": "bullish", "reason": "1.6T pluggable ramp confirmed for 2027 with likely multiple hyperscaler customers", "reason_zh": "27年1.6T放量,估多客戶"}], "theme": "pluggables", "paywalled": false, "zh": "這是我對$SIVE財報後想法和基本面的最後總結。2027年可插拔模組(1.6T放量):$JBL(1.6T LRO,已確認)2027上半年下單,2027下半年放量。可能有多家超大規模資料中心客戶。3家可插拔模組廠(評估中)。3家可插拔模組廠(供應評估中)。", "quoted_zh": "一家公司基本面對,但如果故事講給錯的觀眾聽,估值倍數還是會錯。", "theme_zh": "可插拔模組"}, {"id": "2093947848580858123", "link": "https://x.com/aleabitoreddit/status/2093947848580858123", "author": "aleabitoreddit", "time": "2026-08-30T06:24:05.000Z", "text": "It’s been a little disappointing to see a pattern with some people I've interacted with on X:\n\n- try to engage with the same audience, then quickly move toward aggressively monetizing it   \n\n- get upset when I choose not to participate in or amplify paid groups\n\n- throw out", "social": "", "quoted": "", "tickers": [], "theme": "", "paywalled": false, "zh": "在X上跟一些人互動,發現一種讓人有點失望的模式:先經營同樣的受眾,然後很快就開始積極變現。我選擇不參加或不幫忙宣傳付費社群,他們就不高興。還會丟出", "quoted_zh": "", "theme_zh": ""}, {"id": "2093839436782190731", "link": "https://x.com/aleabitoreddit/status/2093839436782190731", "author": "aleabitoreddit", "time": "2026-08-29T23:13:18.000Z", "text": "So I'm looking through $MRVL SEC filings for fun o…", "social": "", "quoted": "", "tickers": [{"t": "MRVL", "stance": "neutral", "reason": "Just looking through SEC filings, no view stated (teaser)", "reason_zh": "純粹好玩看SEC文件,沒表態"}], "theme": "", "paywalled": true, "zh": "純粹好玩,我在看$MRVL的SEC文件…", "quoted_zh": "", "theme_zh": ""}, {"id": "2093811019823132903", "link": "https://x.com/aleabitoreddit/status/2093811019823132903", "author": "aleabitoreddit", "time": "2026-08-29T21:20:22.000Z", "text": "Okay just to simplify this:\n\nThere is a guy who eats a lot called \n$NVDA\n. Nvidia only wants to buy high-priced potatos off the farmers.\n\nA potato farmer \n$MU\n, that was selling carrots.. rained outlook", "reason_zh": "營收展望大幅上修,供給吃緊"}], "theme": "AI demand", "paywalled": false, "zh": "$NVDA說:「我們預期2028財年營收成長約70%。這是受供給限制的展望。」\n光這句話可能比剛剛整份財報優於預期還重要?\n上修幅度誇張,原本預期成長43.9%,結果變成70%。\n「隨著雲端產業」", "quoted_zh": "$NVDA財報重點:\n營收962.2億美元,優於預期約921.7億美元(優於預期)\n調整後EPS 2.22美元,優於預期2.09至2.10美元(優於預期)\n資料中心890億美元,優於預期約863億美元(優於預期)\n調整後毛利率75%,符合預期75%\n超大規模雲端業者營收487.1億美元,較上季430.5億美元成長(客製ASIC成長並未真的壓抑這塊營收)", "theme_zh": "AI需求"}, {"id": "2092718416683819292", "link": "https://x.com/aleabitoreddit/status/2092718416683819292", "author": "aleabitoreddit", "time": "2026-08-26T20:58:46.000Z", "text": "$NVDA\n earnings TLDR:\n\nRevenue: $96.22B vs. ~$92.17B (beat)\nAdj. EPS: $2.22 vs. $2.09-$2.10 (beat)\nDC: $89.0B vs. ~$86.3B (beat)\nAdj. gross margin: 75% vs. 75%\n\nHyperscaler Revenue: $48.71B from $43.05B last quarter (custom ASIC growth hasn't really prevented this revenue from", "social": "", "quoted": "", "tickers": [{"t": "NVDA", "stance": "neutral", "reason": "reciting earnings beat numbers", "reason_zh": "列出財報優於預期的數字"}], "theme": "earnings", "paywalled": false, "zh": "$NVDA財報重點:\n營收962.2億美元,優於預期約921.7億美元(優於預期)\n調整後EPS 2.22美元,優於預期2.09至2.10美元(優於預期)\n資料中心890億美元,優於預期約863億美元(優於預期)\n調整後毛利率75%,符合預期75%\n超大規模雲端業者營收487.1億美元,較上季430.5億美元成長(客製ASIC成長並未真的壓抑這塊營收)", "quoted_zh": "", "theme_zh": "財報"}, {"id": "2092710854290764161", "link": "https://x.com/aleabitoreddit/status/2092710854290764161", "author": "aleabitoreddit", "time": "2026-08-26T20:28:43.000Z", "text": "I know everyone’s watching \n$NVDA\n earnings right now…\n\nBut did you know Landmark signed a 4 year CW agreement with US customer to ensure “sufficient supply”?\n\nSo now you have:\n\n- \n$LITE\n (capacity gone)\n- \n$COHR\n (capacity gone)\n- Landmark (capacity committed)\n- \n$AAOI\n (capacity for", "social": "", "quoted": "", "tickers": [{"t": "LITE", "stance": "bullish", "reason": "capacity gone, tight CW laser supply", "reason_zh": "產能滿了,CW雷射供給吃緊"}, {"t": "COHR", "stance": "bullish", "reason": "capacity gone, tight CW laser supply", "reason_zh": "產能滿了,CW雷射供給吃緊"}, {"t": "AAOI", "stance": "bullish", "reason": "capacity taken, tight CW laser supply", "reason_zh": "產能被占滿,CW雷射供給吃緊"}, {"t": "Landmark", "stance": "bullish", "reason": "signed 4yr CW supply deal, capacity committed", "reason_zh": "簽4年CW供貨約,產能鎖定"}], "theme": "CW lasers", "paywalled": false, "zh": "我知道大家現在都在盯$NVDA財報...\n但你知道Landmark跟美國客戶簽了4年CW雷射供應協議,確保「供應充足」嗎?\n所以現在情況是:\n- $LITE(產能滿了)\n- $COHR(產能滿了)\n- Landmark(產能已簽約鎖定)\n- $AAOI(產能", "quoted_zh": "", "theme_zh": "CW雷射"}, {"id": "2092665229880836597", "link": "https://x.com/aleabitoreddit/status/2092665229880836597", "author": "aleabitoreddit", "time": "2026-08-26T17:27:25.000Z", "text": "The concept of “cascading bottlenecks” is just super cool.\n\nBecause of DDR4 supply shocks and costs:\n\nLot of ODMs are redesigning downward from DDR4 -\u003e DDR3 -\u003e DDR2.\n\nBut even the legacy players themselves like Winbond are withdrawing from DDR2.\n\nMaking the bottleneck even worse", "social": "", "quoted": "", "tickers": [{"t": "Winbond", "stance": "neutral", "reason": "withdrawing from DDR2, worsening bottleneck", "reason_zh": "退出DDR2,瓶頸更嚴重"}], "theme": "legacy memory", "paywalled": false, "zh": "「連鎖瓶頸」這個概念真的很酷。\n因為DDR4供給衝擊和成本問題,很多ODM都在把設計往下改,從DDR4改成DDR3,再改成DDR2。\n但連華邦這種老牌廠商都在退出DDR2。\n讓瓶頸變得更嚴重", "quoted_zh": "", "theme_zh": "傳統記憶體"}, {"id": "2092540005147410916", "link": "https://x.com/aleabitoreddit/status/2092540005147410916", "author": "aleabitoreddit", "time": "2026-08-26T09:09:49.000Z", "text": "I actually allocated a sizeable amount to the lega…", "social": "", "quoted": "", "tickers": [], "theme": "legacy memory", "paywalled": true, "zh": "我其實把不少資金配置到lega…", "quoted_zh": "", "theme_zh": "傳統記憶體"}, {"id": "2092517102339162263", "link": "https://x.com/aleabitoreddit/status/2092517102339162263", "author": "aleabitoreddit", "time": "2026-08-26T07:38:48.000Z", "text": "I love how so many people requested  $SIVE that Saxo Japan went out of their way to list it!\n\nJust goes optical bottleneck", "paywalled": false, "zh": "好,回到$SMTC這齣戲:「瓶頸嗡嗡叫」。\n我最喜歡的一句話是:「現在拿不拿得到貨,比價格更重要」。\n在現在的光學產品市場。\n已下單的光學訂單,近期預期不會被砍單,這代表他們能把成本轉嫁", "quoted_zh": "", "theme_zh": "光學瓶頸"}, {"id": "2092354322432684098", "link": "https://x.com/aleabitoreddit/status/2092354322432684098", "author": "aleabitoreddit", "time": "2026-08-25T20:51:59.000Z", "text": "Lost interest in \n$SMTC\n and every other earnings report today after finding a memory name way too interesting not to research...", "social": "", "quoted": "", "tickers": [{"t": "SMTC", "stance": "neutral", "reason": "lost interest after earnings, no view given", "reason_zh": "看完財報就沒興趣了,沒給看法"}], "theme": "", "paywalled": false, "zh": "找到一檔太有趣、忍不住想研究的記憶體股票之後,今天對$SMTC和其他所有財報都失去興趣了...", "quoted_zh": "", "theme_zh": ""}, {"id": "2092186856792506435", "link": "https://x.com/aleabitoreddit/status/2092186856792506435", "author": "aleabitoreddit", "time": "2026-08-25T09:46:32.000Z", "text": "Lot of people were wondering about $SIVE earnings in 2 days. \n\nWhat I'm watching out for: \n\n1. I'm hoping for more visibility on photonics co-development/qualifications/contracts. \n\n-\u003e \n$AAOI\n stated multiple customers approaching them for CPO lasers (but had to turn them away)\n-\u003e", "social": "", "quoted": "Please give us some $sive cope 😔🙏", "tickers": [{"t": "SIVE", "stance": "bullish", "reason": "watching for more photonics contract visibility", "reason_zh": "關注光子合約進展"}, {"t": "AAOI", "stance": "neutral", "reason": "stated multiple customers approached for CPO lasers", "reason_zh": "表示多客戶找上門要CPO雷射"}], "theme": "photonics catalysts", "paywalled": false, "zh": "很多人在問兩天後的$SIVE財報。\n我在關注的重點:\n1. 希望能看到更多光子學共同開發、認證、合約的進展。\n→$AAOI表示有多個客戶找上門要CPO雷射,但他們得婉拒(產能不夠)\n→", "quoted_zh": "拜託給我們一些$SIVE的安慰文吧😔🙏", "theme_zh": "光子催化劑"}, {"id": "2092166669900914978", "link": "https://x.com/aleabitoreddit/status/2092166669900914978", "author": "aleabitoreddit", "time": "2026-08-25T08:26:19.000Z", "text": "off the top of my head, just a reca "}, {"id": "2091843192639672553", "link": "https://x.com/aleabitoreddit/status/2091843192639672553", "author": "aleabitoreddit", "time": "2026-08-24T11:00:56.000Z", "text": "Lot of misinterpretations flying left and right around the $600m ATM. I'm still bullish on \n$AAOI\n and I have large positions (which is why I care more). \n\nWhat I've been consistent with is not being a fan of overusing ATMs/dilution for financing. I've said this before with \n$IREN\n +", "social": "", "quoted": "Not bullish anymore??!\n\nUgly price action at the moment for $Aaoi", "tickers": [{"t": "AAOI", "stance": "bullish", "reason": "still bullish, large position, despite ATM criticism", "reason_zh": "仍看好,持股大"}, {"t": "IREN", "stance": "neutral", "reason": "also criticized for overusing ATMs/dilution", "reason_zh": "同樣被批評ATM稀釋"}], "theme": "ATM dilution", "paywalled": false, "zh": "關於6億美元的ATM,很多人誤解亂傳。我還是看好$AAOI,持股很大(所以更在意)。我一直不喜歡用ATM或稀釋股權來過度融資。之前提過$IREN也是+", "quoted_zh": "不看好了嗎?!$AAOI最近股價很難看。", "theme_zh": "ATM稀釋"}, {"id": "2091755022937940422", "link": "https://x.com/aleabitoreddit/status/2091755022937940422", "author": "aleabitoreddit", "time": "2026-08-24T05:10:35.000Z", "text": "\"At dawn begins an economic D-Day, \n\nThe single greatest financial offensive ​ever marshalled against an adversary\", per Bessent in FT. \n\nThe US would target nations that engage with Iran's economy and financial system. Press conference is today 1 PM ET.\n\nNot quite sure markets", "social": "", "quoted": "", "tickers": [], "theme": "macro", "paywalled": false, "zh": "財政部長貝森特在金融時報說:「黎明時分,一場經濟版的諾曼第登陸開始了,這是史上對敵國發動過最大規模的金融攻勢。」美國將針對與伊朗經濟金融系統往來的國家出手。今天下午1點(美東時間)有記者會。不太確定市場", "quoted_zh": "", "theme_zh": "總經"}, {"id": "2091612406900564407", "link": "https://x.com/aleabitoreddit/status/2091612406900564407", "author": "aleabitoreddit", "time": "2026-08-23T19:43:52.000Z", "text": "After watching clips of China's humanoid Olympics... \n\nI think we're cooked chat. \n\nStill can't believe \n$GOOGL\n sold Boston Dynamics, don't think we have another humanoid that can backflip.", "social": "", "quoted": "", "tickers": [{"t": "GOOGL", "stance": "neutral", "reason": "sold Boston Dynamics, no US humanoid can backflip now", "reason_zh": "賣掉BD,無人能後空翻"}], "theme": "humanoids", "paywalled": false, "zh": "看完中國人形機器人奧運的影片,我覺得我們完了。還是不敢相信$GOOGL把Boston Dynamics賣掉,現在沒有其他人形機器人會後空翻了。", "quoted_zh": "", "theme_zh": "人形機器人"}, {"id": "2091488091110531106", "link": "https://x.com/aleabitoreddit/status/2091488091110531106", "author": "aleabitoreddit", "time": "2026-08-23T11:29:53.000Z", "text": "Having a mid-X identity crisis rn:\n\n✓ saw 2025 ideas from \n$AXTI\n to \n$NBIS\n play out with everyone\n✓ we got \n$AMD\n bandanas\n✓ #1 most subscribed person on X by accident\n✓ Chinese “White Hair” nicknames\n✓ 1M followers\n\nStill here to track ideas, but what’s the next side quest?", "social": "", "quoted": "", "tickers": [{"t": "AXTI", "stance": "bullish", "reason": "2025 idea that played out", "reason_zh": "2025年想法應驗"}, {"t": "NBIS", "stance": "bullish", "reason": "2025 idea that played out", "reason_zh": "2025年想法應驗"}], "theme": "recap", "paywalled": false, "zh": "現在有點X平台中年危機:打勾,2025年從$AXTI到$NBIS的想法都應驗了。打勾,大家做了$AMD頭巾。打勾,不小心變成X上訂閱數最多的人。打勾,被中國網友取綽號「白髮」。打勾,100萬粉絲。還是會繼續追蹤想法,但下一個支線任務是什麼?", "quoted_zh": "", "theme_zh": "回顧"}, {"id": "2091264273007960320", "link": "https://x.com/aleabitoreddit/status/2091264273007960320", "author": "aleabitoreddit", "time": "2026-08-22T20:40:31.000Z", "text": "Apparently, \n$RDDT\n thinks \n$MRVL\n had two major catalysts recently:\n\nThe $12.2B Google TPU ecosystem agreement.\n\nAnd…\n\nSpider-Man: “Brand New Day”", "social": "", "quoted": "", "tickers": [{"t": "MRVL", "stance": "neutral", "reason": "catalysts cited: Google TPU deal and Spider-Man tie-in", "reason_zh": "催化劑:TPU案、蜘蛛人"}], "theme": "MRVL catalysts", "paywalled": false, "zh": "看起來$RDDT認為$MRVL最近有兩個重要催化劑:一個是122億美元的Google TPU生態系合作案。另一個是,蜘蛛人電影《全新的一天》。", "quoted_zh": "", "theme_zh": "催化劑"}, {"id": "2091177173789069797", "link": "https://x.com/aleabitoreddit/status/2091177173789069797", "author": "aleabitoreddit", "time": "2026-08-22T14:54:25.000Z", "text": "It's been fun to read these US Gov fact sheets (few a week) recently. \n\nEarlier this week was \"Golden Age of Space Transportation\", with \n$SPCX\n hard carrying the launch sector like Faker. \n\nAnd \n$RKLB\n + other rocket companies as beneficiaries of the 1K launch/reentry goal by 2030.", "social": "", "quoted": "", "tickers": [{"t": "SPCX", "stance": "bullish", "reason": "hard carrying the launch sector", "reason_zh": "獨自carry發射產業"}, {"t": "RKLB", "stance": "bullish", "reason": "beneficiary of 1K launch/reentry goal by 2030", "reason_zh": "受惠2030千次發射目標"}], "theme": "space launch", "paywalled": false, "zh": "最近讀美國政府的事實說明書滿好玩的(一週好幾份)。這週稍早是「太空運輸黃金時代」,$SPCX像電競選手Faker一樣獨自carry整個發射產業。$RKLB和其他火箭公司則受惠於2030年前完成1000次發射再入目標的計畫。", "quoted_zh": "", "theme_zh": "太空發射"}, {"id": "2090903631793127644", "link": "https://x.com/aleabitoreddit/status/2090903631793127644", "author": "aleabitoreddit", "time": "2026-08-21T20:47:27.000Z", "text": "It's getting much harder to support \n$AAOI\n when they keep dropping $500m or $600M ATMs left and right. \n\nAt a certain point, the operating outlook could be positive. \n\nBut the share structure/financing becomes increasingly shareholder unfriendly. \n\nReally, really, dislike ATMs and", "social": "", "quoted": "", "tickers": [{"t": "AAOI", "stance": "bearish", "reason": "repeated $500-600M ATMs make share structure shareholder-unfriendly", "reason_zh": "連續ATM,股權不友善"}], "theme": "ATM dilution", "paywalled": false, "zh": "$AAOI一直丟出5億或6億美元的ATM,越來越難挺了。營運展望可能是正向的。但股權結構和融資方式對股東越來越不友善。真的真的很討厭ATM,還有", "quoted_zh": "", "theme_zh": "ATM稀釋"}, {"id": "2090816483861696517", "link": "https://x.com/aleabitoreddit/status/2090816483861696517", "author": "aleabitoreddit", "time": "2026-08-21T15:01:09.000Z", "text": "Uhh Citadel?\n\n\u003e Say emergency rate hike. More crashes/liquidations follow\n\n\u003e 台外的推銷內容,是惡意的…", "quoted_zh": "", "theme_zh": "假訊息"}, {"id": "2090510568474231045", "link": "https://x.com/aleabitoreddit/status/2090510568474231045", "author": "aleabitoreddit", "time": "2026-08-20T18:45:33.000Z", "text": "After seeing how the robotics and space sectors reacted to Unitree and \n$SPCX\n IPOs\n\nI’m not quite sure I want Anthropic to go public…", "social": "", "quoted": "", "tickers": [{"t": "SPCX", "stance": "neutral", "reason": "IPO reaction referenced as context", "reason_zh": "IPO反應作為參考"}, {"t": "Anthropic", "stance": "neutral", "reason": "hesitant about it going public given IPO froth reactions", "reason_zh": "IPO過熱讓他猶豫上市"}], "theme": "IPO froth", "paywalled": true, "zh": "看到機器人和太空產業對Unitree和$SPCX IPO的反應之後,我不太確定還想不想讓Anthropic上市…", "quoted_zh": "", "theme_zh": "IPO過熱"}, {"id": "2090490101260591481", "link": "https://x.com/aleabitoreddit/status/2090490101260591481", "author": "aleabitoreddit", "time": "2026-08-20T17:24:14.000Z", "text": "Very positive. My opinion is that the optical sector underperformance recently from \n$AAOI\n to $SIVE has been absurd.\n\nThe demand visibility... is just way too stupidly high.\n\nAOI: “Even combined AOI, Coherent program altogether, is still very tough to meet the customer demand in", "social": "", "quoted": "you’re still positive about $SIVE, right? just needs time to play out.", "tickers": [{"t": "AAOI", "stance": "bullish", "reason": "underperformance absurd given stupidly high demand visibility", "reason_zh": "需求高,股價卻弱勢"}, {"t": "SIVE", "stance": "bullish", "reason": "underperformance absurd given stupidly high demand visibility", "reason_zh": "需求高,股價卻弱勢"}], "theme": "optical demand", "paywalled": false, "zh": "非常正向。我認為最近光通訊產業表現不佳,從$AAOI到$SIVE,根本不合理。需求能見度真的高到誇張。AOI說:「就算把AOI和Coherent的產能加在一起,也很難滿足客戶需求在", "quoted_zh": "你對$SIVE還是正向的吧?只是需要時間發酵。", "theme_zh": "光通訊需求"}, {"id": "2090374603264929981", "link": "https://x.com/aleabitoreddit/status/2090374603264929981", "author": "aleabitoreddit", "time": "2026-08-20T09:45:17.000Z", "text": "I'm glad the leverage bros moved from AI stocks back to Hyerliquid and biotech like \n$MRNA\n, so maybe we'll see a faster recovery. \n\nAside from that just some TLDR stuff:\n\n- \n$EWY\n up, primarily from SK Hynix buybacks (they're just too profitable), and Samsung Foundry roughly ~10-15%", "social": "", "quoted": "", "tickers": [{"t": "SKHY", "stance": "bullish", "reason": "buybacks because they're too profitable", "reason_zh": "獲利好,大買回股票"}, {"t": "Samsung", "stance": "neutral", "reason": "foundry shares up ~10-15%", "reason_zh": "代工廠漲約10-15%"}], "theme": "Korea memory/foundry", "paywalled": false, "zh": "很高興槓桿仔們從AI股轉去玩Hyperliquid和$MRNA這類生技股了,這樣或許能讓AI股更快回穩。其他重點:$EWY上漲,主要因為SK海力士回購股票(獲利太好了),三星代工廠股價大約漲10到15%", "quoted_zh": "", "theme_zh": "韓國記憶體"}, {"id": "2090103899302826302", "link": "https://x.com/aleabitoreddit/status/2090103899302826302", "author": "aleabitoreddit", "time": "2026-08-19T15:49:36.000Z", "text": "$MRVL\n gives \n$GOOGL\n options to buy $12.2B of the company. \n\n\"The Marvell-Google deal covers a broad range of technologies used ​with TPUs, including processors that run AI models, manage data storage ​and  move information ⁠across networks.\"\n\nWhich could translate into ~$120", "social": "", "quoted": "", "tickers": [{"t": "MRVL", "stance": "bullish", "reason": "deal could translate into large revenue upside", "reason_zh": "合約估可帶動營收成長"}, {"t": "GOOGL", "stance": "neutral", "reason": "took options to buy $12.2B of MRVL", "reason_zh": "取得買122億MRVL選擇權"}], "theme": "TPU deal", "paywalled": false, "zh": "$MRVL給$GOOGL選擇權,可以買下公司122億美元的股份。「Marvell和Google的合約涵蓋很多TPU相關技術,包括跑AI模型的處理器、管理資料儲存,還有跨網路傳輸資料。」這可能帶來大約120", "quoted_zh": "", "theme_zh": "TPU合作"}, {"id": "2089973586425766134", "link": "https://x.com/aleabitoreddit/status/2089973586425766134", "author": "aleabitoreddit", "time": "2026-08-19T07:11:47.000Z", "text": "We got \n$LITE\n, \n$MTSI\n, \n$AAOI\n all pointing to extreme demand imbalances with lasers/TIA/DSP/etc from earnings... \n\nAnd now Elazr GM at their investor conference stated: \n\nOptical supply is still far behind the market demand, the expected AI optical supply chain are likely to", "social": "", "quoted": "", "tickers": [{"t": "LITE", "stance": "bullish", "reason": "pointing to extreme demand imbalance", "reason_zh": "顯示需求嚴重失衡"}, {"t": "MTSI", "stance": "bullish", "reason": "pointing to extreme demand imbalance", "reason_zh": "顯示需求嚴重失衡"}, {"t": "AAOI", "stance": "bullish", "reason": "pointing to extreme demand imbalance", "reason_zh": "顯示需求嚴重失衡"}], "theme": "optical demand", "paywalled": false, "zh": "$LITE、$MTSI、$AAOI在財報都指出雷射、TIA、DSP等零件需求嚴重失衡。現在Elazr的GM在投資人會議上說:光通訊供給還是遠遠落後市場需求,預期AI光通訊供應鏈可能", "quoted_zh": "", "theme_zh": "光通訊需求"}, {"id": "2089908198694351064", "link": "https://x.com/aleabitoreddit/status/2089908198694351064", "author": "aleabitoreddit", "time": "2026-08-19T02:51:57.000Z", "text": "Unitree (688836) is now public.\n\nAnd is valued at ~$53.3B, after rising +492.18%\n\nWe finally have a major public company benchmark for humanoids.\n\nFor reference, Agility (backed by \n$NVDA\n, \n$AMZN\n) via \n$CCXI\n is expected to go public at $2.5B premoney valuation Q4. \n\n\n$TSLA\n is $1T+,", "social": "", "quoted": "", "tickers": [{"t": "Unitree", "stance": "neutral", "reason": "public at ~$53.3B after +492% rise", "reason_zh": "上市市值約533億美元"}, {"t": "CCXI", "stance": "neutral", "reason": "Agility vehicle expected to list at $2.5B premoney", "reason_zh": "Agility估值25億美元"}, {"t": "TSLA", "stance": "neutral", "reason": "comparison point at $1T+ valuation", "reason_zh": "對照:TSLA市值破1兆"}], "theme": "humanoids", "paywalled": false, "zh": "Unitree(688836)上市了。股價漲492.18%後,市值大約533億美元。我們終於有人形機器人產業的大型上市公司可以當基準了。對照來看,$NVDA、$AMZN投資的Agility,透過$CCXI預計第四季以25億美元(上市前估值)上市。$TSLA市值破1兆美元,", "quoted_zh": "", "theme_zh": "人形機器人"}, {"id": "2089766053274661143", "link": "https://x.com/aleabitoreddit/status/2089766053274661143", "author": "aleabitoreddit", "time": "2026-08-18T17:27:07.000Z", "text": "My \n$AAOI\n TLDR notes at Rosenblatt summit:\n\n- Expected to get paid premiums for US production of 800g/1.6T (very positive for ASP/margins).\n\n- Several LTAs on the table, but doesn't want to sign to get capacity blocked by other customers (cough cough \n$NVDA\n). \n\n- Sold out at least", "social": "", "quoted": "", "tickers": [{"t": "AAOI", "stance": "bullish", "reason": "US production premiums very positive for ASP/margins, sold out", "reason_zh": "美國製造有溢價,產能賣完"}], "theme": "optical margins", "paywalled": false, "zh": "我在Rosenblatt高峰會上聽到的$AAOI重點筆記:美國製造800G、1.6T預期能拿到溢價(對均價和毛利很正向)。有好幾份長約在談,但不想簽,怕產能被其他客戶卡住(咳咳,$NVDA)。至少賣完", "quoted_zh": "", "theme_zh": "光通訊毛利"}, {"id": "2089746797300432912", "link": "https://x.com/aleabitoreddit/status/2089746797300432912", "author": "aleabitoreddit", "time": "2026-08-18T16:10:36.000Z", "text": "I'm getting Vietnam flashbacks to the launch of OpenAi. \n\nWhere with every model, it just keeps getting better... but now with hunanoids. \n\nUnitree has claimed that their humanoids:\n\n- Can now run faster than Usain Bolt.\n- Can now jump higher than any human. \n\nAnd with their IPO", "social": "", "quoted": "", "tickers": [{"t": "Unitree", "stance": "bullish", "reason": "claims outrunning Usain Bolt, jumping higher than humans, IPO", "reason_zh": "宣稱跑贏波特,跳更高"}], "theme": "humanoids", "paywalled": false, "zh": "這讓我想起OpenAI剛推出的時候,每個新模型都越來越強,現在換成人形機器人也是這樣。Unitree宣稱他們的人形機器人:跑得比Usain Bolt還快。跳得比任何人都高。再加上他們IPO", "quoted_zh": "", "theme_zh": "人形機器人"}, {"id": "2089690098875130084", "link": "https://x.com/aleabitoreddit/status/2089690098875130084", "author": "aleabitoreddit", "time": "2026-08-18T12:25:18.000Z", "text": "Looks like we're getting the Strait of America, a new US territory...", "social": "", "quoted": "", "tickers": [], "theme": "geopolitics", "paywalled": false, "zh": "看起來我們要有「美國海峽」了,一個新的美國領土…", "quoted_zh": "", "theme_zh": "地緣政治"}, {"id": "2089547564249219163", "link": "https://x.com/aleabitoreddit/status/2089547564249219163", "author": "aleabitoreddit", "time": "2026-08-18T02:58:55.000Z", "text": "So just tracking the MLCC cycle:\n\nComponentNews classified server MLCCs as “severe” shortage stage, with ETNews reporting:\n\n- Samsung has reached ~40 week lead times for some high capacitance MLCCs per DigiKey’s shipment data.\n\nEarlier this year, broader reports were ~20 weeks,", "social": "", "quoted": "", "tickers": [{"t": "Samsung", "stance": "neutral", "reason": "MLCC lead times reached about 40 weeks per DigiKey shipment data", "reason_zh": "MLCC 交期依 DigiKey 出貨資料達約 40 週"}], "theme": "MLCC shortage", "paywalled": false, "zh": "追蹤 MLCC 週期。ComponentNews 把伺服器用 MLCC 列為嚴重缺貨等級。ETNews 報導:三星部分高容量 MLCC 交期已達約 40 週,數據來自 DigiKey 出貨資料。今年稍早,普遍交期約 20 週。", "quoted_zh": "", "theme_zh": "MLCC缺貨"}, {"id": "2089422562019393654", "link": "https://x.com/aleabitoreddit/status/2089422562019393654", "author": "aleabitoreddit", "time": "2026-08-17T18:42:13.000Z", "text": "I've decided to name my next two pets Applied Optoelectronics and Sivers Semiconductors", "social": "", "quoted": "", "tickers": [{"t": "AAOI", "stance": "neutral", "reason": "Playfully names pets after them, no explicit investment view stated", "reason_zh": "用公司名幫寵物取名,沒說投資看法"}, {"t": "SIVE", "stance": "neutral", "reason": "Playfully names pets after them, no explicit investment view stated", "reason_zh": "用公司名幫寵物取名,沒說投資看法"}], "theme": "photonics", "paywalled": false, "zh": "決定把下兩隻寵物取名叫 Applied Optoelectronics 和 Sivers Semiconductors。", "quoted_zh": "", "theme_zh": "光子學"}, {"id": "2089355682286092748", "link": "https://x.com/aleabitoreddit/status/2089355682286092748", "author": "aleabitoreddit", "time": "2026-08-17T14:16:27.000Z", "text": "It's official, Unitree the 8000x+ retail oversubscribed humanoid company in China.\n\nIs expected to go public in 2 days! So the 19th. \n\nOpening is implied to be around ~$41.66B MC per derivatives, around +363.3% above its ~$9B IPO valuation. \n\nFun times for humanoids this week.", "social": "", ity for consumer/general-purpose MLCCs.\n\nIf you get Vietnam flashbacks like I do to \n$MU\n / Samsung / SK Hynix -\u003e Legacy DRAM: \n\nMy thesis is we'll see the same thing here maybe late H2,", "social": "", "quoted": "", "tickers": [], "theme": "legacy MLCC", "paywalled": false, "zh": "AI 伺服器用 MLCC 需求,好像正在造成一個有趣的效應,消費性/通用型 MLCC 產能被排擠。如果你也像我一樣想起以前 $MU / 三星 / SK 海力士的舊型 DRAM 情況:我認為今年下半年較晚的時候,這裡也會發生類似的事。", "quoted_zh": "", "theme_zh": "傳統MLCC"}, {"id": "2089165155741622679", "link": "https://x.com/aleabitoreddit/status/2089165155741622679", "author": "aleabitoreddit", "time": "2026-08-17T01:39:22.000Z", "text": "\"Severe InP Shortage Triggers Largest Price Hike Ever\" - \n$AXTI\n. \n\nSuppliers have bluntly stated that \"even if you have the money, you still may not be able to get the material\" (lol). \n\n- Industry sources revealed that InP substrate prices began rising in Q4 last year and was the", "social": "", "quoted": "", "tickers": [{"t": "AXTI", "stance": "bullish", "reason": "Severe InP shortage triggering the largest-ever price hikes", "reason_zh": "InP嚴重缺貨引發史上最大漲價潮"}], "theme": "InP shortage", "paywalled": false, "zh": "「InP 嚴重缺貨,引發史上最大漲價潮」,講的是 $AXTI。供應商直白地說「就算你有錢,也不一定買得到料」(笑)。業界消息指出,InP 基板價格從去年第四季開始上漲,而且是", "quoted_zh": "", "theme_zh": "InP缺貨"}, {"id": "2089148883838611460", "link": "https://x.com/aleabitoreddit/status/2089148883838611460", "author": "aleabitoreddit", "time": "2026-08-17T00:34:43.000Z", "text": "Stripe reportedly buys OpenRouter for $7 Billion.\n\nI think their orchestration is easy to replicate and switch from. And there's very little moat.\n\nBut atm, OpenRouter has the userbase, valuable dataset, + momentum. \n\nWhat's your take... Yay or Nay for the payments firm?", "social": "", "quoted": "", "tickers": [{"t": "OpenRouter", "stance": "neutral", "reason": "Little moat and easy to replicate, but has userbase, data, momentum", "reason_zh": "護城河小容易被取代,但有用戶數據和動能"}], "theme": "AI orchestration M\u0026A", "paywalled": false, "zh": "傳出 Stripe 以 70 億美元收購 OpenRouter。我認為他們的調度系統很容易被複製或替換,護城河很小。但目前 OpenRouter 有使用者基礎、有價值的數據,加上動能。你怎麼看,對這家支付公司來說是好事還是壞事?", "quoted_zh": "", "theme_zh": "AI調度併購"}, {"id": "2089057857652338993", "link": "https://x.com/aleabitoreddit/status/2089057857652338993", "author": "aleabitoreddit", "time": "2026-08-16T18:33:00.000Z", "text": "I think \n@elonmusk\n said it best: \n\n“Robots don’t all need to be humanoid. \n\nBut a general-purpose robot intended to replace human labor should fit the world humans already built.\n\nRoger, roger.”\n\nPersonally, I expect \n$TSLA\n Optimus form factor to converge to the right image.", "social": "", "quoted": "I can’t understand why robots have to be humanoid as many applications don’t require them to be", "tickers": [{"t": "TSLA", "stance": "neutral", "reason": "Expects Optimus form factor to converge toward general-purpose design", "reason_zh": "預期Optimus外型會逐漸靠向通用設計"}], "theme": "humanoid robots", "paywalled": false, "zh": "我覺得 @elonmusk 這句話講得最好:「機器人不一定都要長得像人。但要取代人力的通用機器人,外型要能適應人類已經蓋好的世界。收到,收到。」我個人認為 $TSLA Optimus 的外型會慢慢往這個方向靠攏。", "quoted_zh": "不懂為什麼機器人一定要長得像人,很多應用根本不需要人形。", "theme_zh": "人形機器人"}, {"id": "2088947694886920409", "link": "https://x.com/aleabitoreddit/status/2088947694886920409", "author": "aleabitoreddit", "time": "2026-08-16T11:15:15.000Z", "text": "I feel like AI investing is simpler than what people expect. \n\nBecause \n$NVDA\n + Jensen literally tells everyone what's coming. \n\nBut somehow. Almost every. single. time. Markets dismiss it until it actually happens? \n\nBe Nvidia in 2025:  Buys up EML and laser capacity. \n\nMarkets", "social": "", "quoted": "", "tickers": [{"t": "NVDA", "stance": "bullish", "reason": "Jensen/NVDA telegraphs AI trends early, market doubts until proven right", "reason_zh": "黃仁勳與NVDA提早預告趨勢,市場總是等應驗才信"}], "theme": "AI capex", "paywalled": false, "zh": "我覺得投資 AI 其實比大家想的簡單。因為 $NVDA 和黃仁勳根本直接告訴大家接下來會發生什麼。但不知道為什麼,幾乎每一次,市場都要等到真的發生才相信。2025 年的輝達:大量買下 EML 和雷射產能。市場", "quoted_zh": "", "theme_zh": "AI資本支出"}, 有關聯", "quoted_zh": "IQE 有新消息嗎?最近好像發布不少好消息,想聽聽你的看法。", "theme_zh": "光學供應鏈"}, {"id": "2087807614172488131", "link": "https://x.com/aleabitoreddit/status/2087807614172488131", "author": "aleabitoreddit", "time": "2026-08-13T07:44:59.000Z", "text": "$SIVE announces a $3.4M development program with SemiNex!\n\nFor CPO, DFB laser arrays, and optical amplifiers. \n\nEarly production is targeted H2 2027 (in line with early scale up CPO timelines)\n\nSeemed weird to me at first given product overlap, since SemiNex is a much smaller", "social": "", "quoted": "", "tickers": [{"t": "SIVE", "stance": "neutral", "reason": "Announces $3.4M CPO/laser JV with SemiNex, though overlap seemed odd", "reason_zh": "宣布與SemiNex合作340萬美元CPO雷射計畫,產品重疊感覺奇怪"}], "theme": "CPO lasers", "paywalled": false, "zh": "$SIVE 宣布跟 SemiNex 合作 340 萬美元的開發計畫,項目包括 CPO、DFB 雷射陣列和光放大器。初期量產目標是 2027 年下半年(符合 CPO 早期放量的時程)。一開始覺得有點怪,因為產品有重疊,畢竟 SemiNex 規模小很多", "quoted_zh": "", "theme_zh": "CPO雷射"}, {"id": "2087733927930929435", "link": "https://x.com/aleabitoreddit/status/2087733927930929435", "author": "aleabitoreddit", "time": "2026-08-13T02:52:11.000Z", "text": "Is it just me, or is the list of 3 letter optical jargon never ending?\n\nWe have LPO, LRO, NPO, XPO, CPO, OBO, and others for approaches.\n\nThen InP, EML, ELS, OCS, SOI, and others to add to the random terms.\n\nEven the industry events with OCP or OFC get their three letter names.", "social": "", "quoted": "", "tickers": [], "theme": "optical jargon", "paywalled": false, "zh": "只有我這樣覺得嗎,光通訊的三字母術語永遠列不完。有LPO、LRO、NPO、XPO、CPO、OBO這些方法。還有InP、EML、ELS、OCS、SOI這些隨機術語。連產業活動OCP跟OFC都用三個字母命名。", "quoted_zh": "", "theme_zh": "光學術語"}, {"id": "2087723789190926760", "link": "https://x.com/aleabitoreddit/status/2087723789190926760", "author": "aleabitoreddit", "time": "2026-08-13T02:11:54.000Z", "text": "Just some more thoughts on Taiyo Yuden and the Sit…", "social": "", "quoted": "", "tickers": [{"t": "Taiyo Yuden (6976)", "stance": "neutral", "reason": "teases more thoughts, no view given yet", "reason_zh": "還沒講想法,只是預告"}], "theme": "", "paywalled": true, "zh": "再多分享一點關於Taiyo Yuden和Sit的想法…", "quoted_zh": "", "theme_zh": ""}, {"id": "2087675367595380783", "link": "https://x.com/aleabitoreddit/status/2087675367595380783", "author": "aleabitoreddit", "time": "2026-08-12T22:59:29.000Z", "text": "My main takeaway was that your merchant CW laser suppliers seem to be EXTREMELY IMPORTANT now. \n\nBut TLDR of \n$COHR\n earnings:\n\n\"given the demand that we see in our DC business with transceivers, I don’t see any time in the near future where we would be selling indium phosphide", "social": "", "quoted": "Did you take a look at COHR earnings by chance?", "tickers": [{"t": "COHR", "stance": "bullish", "reason": "CW laser suppliers now extremely important, strong DC transceiver demand", "reason_zh": "CW雷射供應商現在極重要,資料中心收發器需求強"}], "theme": "CW lasers", "paywalled": false, "zh": "我的主要心得是,商用CW雷射供應商現在變得非常重要。但$COHR財報重點:「以我們資料中心收發器業務的需求來看,近期看不到我們會賣磷化銦」", "quoted_zh": "你有看COHR財報嗎?", "theme_zh": "CW雷射"}, {"id": "2087515371750490383", "link": "https://x.com/aleabitoreddit/status/2087515371750490383", "author": "aleabitoreddit", "time": "2026-08-12T12:23:43.000Z", "text": "$NBIS\n outlook is pretty insane yet again.\n\n$582.3M revenue (+454% Y/Y, +46% Q/Q) off ~50% adjusted EBITDA margin (AI Cloud). $8.04B cash on hand. \n\nReiterates financial guide (2026 revenue: $3.0-$3.4B\n2026 EoY ARR: $7-$9B), I was hoping for a raise, but it's already massive", "social": "", "quoted": "", "tickers": [{"t": "NBIS", "stance": "bullish", "reason": "insane outlook, huge revenue growth, cash pile, guide reiterated", "reason_zh": "展望誇張,營收大成長,現金多,財測維持"}], "theme": "neoclouds", "paywalled": false, "zh": "$NBIS展望又一次超誇張。營收$582.3M(年增454%,季增46%),AI雲端調整後EBITDA利潤率約50%。現金$8.04B。維持財測(2026營收$3.0到$3.4B,2026年底ARR $7到$9B),原本希望上調,但數字已經很誇張了", "quoted_zh": "", "theme_zh": "新雲端"}, {"id": "2087505570941239683", "link": "https://x.com/aleabitoreddit/status/2087505570941239683", "author": "aleab // Pure calculations for the page: no DOM, so tests/calc.test.js can run them in Node.
// `now` is a millisecond timestamp; the page passes Date.now().
const Calc = (() => {
  const STANCE_CLASS = { bullish: 'bull', bearish: 'bear', neutral: 'neu' };
  const STANCE_ZH = { bullish: '看多', bearish: '看空', neutral: '中立' };
  const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
  const TOP_N = 15; // tickers shown before "顯示全部"
  const DAY_MS = 864e5;

  // Unknown or missing stance counts as neutral.
  function stanceOf(s) { return STANCE_CLASS[s] ? s : 'neutral'; }

  // Start of a tab's time window. 0 = all time, 1 = today (local calendar day), n = last n x 24 hours.
  function windowStart(days, now) {
    if (!days) return -Infinity;
    if (days === 1) { const t = new Date(now); t.setHours(0, 0, 0, 0); return t.getTime(); }
    return now - days * DAY_MS;
  }
  function inWindow(post, days, now) { return new Date(post.time).getTime() >= windowStart(days, now); }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Local-time labels.
  function dateLabel(iso) {
    const d = new Date(iso);
    return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日（週' + WEEKDAYS[d.getDay()] + '）';
  }
  function timeLabel(iso) {
    const d = new Date(iso);
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  function dateKey(iso) { const d = new Date(iso); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

  // X puts cashtags on their own line when scraped ("text\n$NVDA\nmore"); join them back, and squeeze blank lines.
  function cleanText(text) {
    return String(text || '').replace(/\n\$([A-Z.]+)\n/g, ' $$$1 ').replace(/\n{3,}/g, '\n\n');
  }

  function isXLink(link) { return /^https:\/\/x\.com\//.test(link || ''); }

  // Which summary goes with a tab: 7 and 28 have their own, the others borrow the 7-day one.
  function briefKey(days) { return (days === 7 || days === 28) ? String(days) : '7'; }

  function postsHeading(days) { return days ? `貼文（${days === 1 ? '今天' : days + ' 天'}）` : '貼文（全部）'; }

  // One row per ticker: mentions, stance counts, and the latest reason
  // (newest non-paywalled post with a reason, else the newest mention). `posts` must be newest first.
  function tickerRows(posts) {
    const agg = {};
    for (const p of posts) for (const k of p.tickers) {
      const a = agg[k.t] ??= { t: k.t, n: 0, bullish: 0, bearish: 0, neutral: 0 };
      a.n++; a[stanceOf(k.stance)]++;
    }
    for (const t in agg) {
      let found = null, fallback = null;
      for (const p of posts) {
        const k = p.tickers.find(x => x.t === t);
        if (!k) continue;
        if (!fallback) fallback = { reason: k.reason_zh, stance: k.stance };
        if (!p.paywalled && k.reason_zh) { found = { reason: k.reason_zh, stance: k.stance }; break; }
      }
      const use = found || fallback;
      agg[t].lastReason = use ? (use.reason || '') : '';
      agg[t].lastStance = stanceOf(use && use.stance);
    }
    return Object.values(agg).sort((a, b) => b.n - a.n || a.t.localeCompare(b.t));
  }

  // All-time posts about one ticker, with stance counts.
  function stockSummary(data, sym) {
    const list = data.filter(p => p.tickers.some(k => k.t === sym));
    let bull = 0, bear = 0, neu = 0;
    for (const p of list) {
      const st = stanceOf(p.tickers.find(x => x.t === sym).stance);
      if (st === 'bullish') bull++; else if (st === 'bearish') bear++; else neu++;
    }
    return { list, bull, bear, neu };
  }

  return { STANCE_CLASS, STANCE_ZH, TOP_N, stanceOf, windowStart, inWindow, esc, dateLabel, timeLabel, dateKey,
    cleanText, isXLink, briefKey, postsHeading, tickerRows, stockSummary };
})();
if (typeof module !== 'undefined') module.exports = Calc;

function stanceTag(stance, label) {

function postHtml(p, focus) {
  const labs = p.tickers.map(k => {
    const reason = (focus && k.t === focus && k.reason_zh && !p.paywalled) ? ` <span class="reason">${esc(k.reason_zh)}</span>` : '';
    const st = Calc.stanceOf(k.stance);
    return stanceTag(st, `${esc(k.t)} ${STANCE_ZH[st]}`) + reason;
  }).join(' ');
  const txt = Calc.cleanText(p.text);
  const zhText = p.zh ? p.zh : txt;
  const pay = p.paywalled ? ' <span class="mute">付費貼文，只有開頭</span>' : '';
  const link = Calc.isXLink(p.link) ? `<a href="${esc(p.link)}" target="_blank" rel="noopener noreferrer" aria-label="在 X 開啟原貼文（另開新分頁）">在 X 開啟</a>` : '';
  const meta = `<span><time class="mute" datetime="${esc(p.time)}">${Calc.timeLabel(p.time)}</time>${pay}</span>${link}`;
  const en = p.zh ? `<details><summary>英文原文</summary><div class="quoted">${esc(txt)}</div></details>` : '';
  const q = p.quoted ? `<details><summary>她回應的內容</summary><div class="quoted">${esc(p.quoted_zh || p.quoted)}${p.quoted_zh ? '\n\n原文：' + esc(p.quoted) : ''}</div></details>` : '';
  return `<article class="post"><div class="meta">${meta}</div><div class="lab">${labs}</div><div class="txt clamp">${esc(zhText)}</div><button type="button" class="expand">展開</button>${en}${q}</article>`;
}

// Posts with a date heading whenever the local day changes.
function postsHtml(list, focus) {
  let out = '', lastKey = null;
  for (const p of list) {
    const k = Calc.dateKey(p.time);
    if (k !== lastKey) { out += `<h3 class="dhead">${Calc.dateLabel(p.time)}</h3>`; lastKey = k; }
    out += postHtml(p, focus);
  }
  return out;
}

// Hide "展開" on posts short enough to fit in 5 lines; wire up the rest.
function applyClamp(container) {
  container.querySelectorAll('.txt.clamp').forEach(el => {
    const btn = el.nextElementSibling;
    if (!el.clientHeight) return; // not laid out yet (e.g. inside closed <details>), measure later
    if (el.scrollHeight <= el.clientHeight + 2 && btn && btn.classList.contains('expand')) btn.style.display = 'none';
  });
  container.querySelectorAll('.expand').forEach(btn => {
    btn.onclick = () => { btn.previousElementSibling.classList.remove('clamp'); btn.style.display = 'none'; };
  });
}

function showSections(stockPage) {
  for (const id of ['tabs', 'brief', 'listSec', 'tlSec']) $(id).style.display = stockPage ? 'none' : '';
  $('stockSec').style.display = stockPage ? '' : 'none';
}

function tickerRowHtml(r) {
  const mix = (r.bullish > 0 && r.bearish > 0) ? `<span class="mute">多 ${r.bullish}・空 ${r.bearish}</span>` : '';
  return `<button type="button" class="tkrow" data-t="${esc(r.t)}"><span class="l1"><span class="sym">${esc(r.t)}</span><span class="mute">提到 ${r.n} 次</span></span>`
    + `<span class="l2">${stanceTag(r.lastStance, STANCE_ZH[r.lastStance])} <span class="reason">${esc(r.lastReason)}</span> ${mix}</span></button>`;
}

function renderList() {
  showSections(false);
  const posts = DATA.filter(p => Calc.inWindow(p, state.days, Date.now()));

  // Summary only when the window has posts, so an old summary never sits on an empty page.
  const pts = BRIEF[Calc.briefKey(state.days)] || [];
  $('brief').innerHTML = (pts.length && posts.length) ? ('<ol>' + pts.map(t => `<li>${esc(t)}</li>`).join('') + '</ol>') : '';

  const rows = Calc.tickerRows(posts);
  const shown = state.showAllTickers ? rows : rows.slice(0, Calc.TOP_N);
  $('tk').innerHTML = shown.map(tickerRowHtml).join('') || '<div class="mute">這段時間沒有貼文</div>';
  document.querySelectorAll('.tkrow').forEach(el => el.onclick = () => { state.sel = el.dataset.t; render(); window.scrollTo(0, 0); $('stitle').focus({ preventScroll: true }); });
  const moreBtn = $('moreBtn');
  if (!state.showAllTickers && rows.length > Calc.TOP_N) { moreBtn.style.display = ''; moreBtn.textContent = `顯示全部 ${rows.length} 檔`; }
  else moreBtn.style.display = 'none';

  $('tlHead').textContent = Calc.postsHeading(state.days);
  const withTk = posts.filter(p => p.tickers.length > 0);
  const noTk = posts.filter(p => p.tickers.length === 0);
  $('tl').innerHTML = postsHtml(withTk);
  const otherSec = $('otherSec');
  otherSec.innerHTML = noTk.length ? (`<summary>其他貼文（沒提到股票）${noTk.length} 則</summary><div>` + postsHtml(noTk) + '</div>') : '';
  otherSec.style.display = noTk.length ? '' : 'none';
  applyClamp($('tl'));
  otherSec.ontoggle = () => { if (otherSec.open) applyClamp(otherSec); };
}

function renderStock() {
  showSections(true);
  const s = Calc.stockSummary(DATA, state.sel);
  $('stitle').textContent = state.sel;
  $('ssub').textContent = `提到 ${s.list.length} 次，看多 ${s.bull}、看空 ${s.bear}、中立 ${s.neu}（全部時間）`;
  $('stlist').innerHTML = postsHtml(s.list, state.sel);
  applyClamp($('stlist'));
}

function render() { if (state.sel) renderStock(); else renderList(); }

document.querySelectorAll('#tabs button').forEach(b => {
  const d = +b.dataset.d, n = DATA.filter(p => Calc.inWindow(p, d, Date.now())).length;
  b.textContent = b.textContent + ' · ' + n;
  b.onclick = () => {
    state.days = d; state.showAllTickers = false;
    document.querySelectorAll('#tabs button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
    render();
  };
});
$('moreBtn').onclick = () => { state.showAllTickers = true; render(); };
$('backBtn').onclick = () => {
  const was = state.sel;
  state.sel = null; render(); window.scrollTo(0, 0);
  // keyboard users land back on the stock they opened (if it is still in the list)
  const row = [...document.querySelectorAll('.tkrow')].find(el => el.dataset.t === was);
  if (row) row.focus({ preventScroll: true });
};
render();
</script></body></html>
